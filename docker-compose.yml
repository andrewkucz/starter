services:
  web:
    build:
      context: .
      # Only these values reach the build; everything else comes from committed env files and Infisical.
      args:
        VITE_PUBLIC_URL: ${VITE_PUBLIC_URL:?}
      secrets:
        - infisical_client_id
        - infisical_client_secret
        - postgres_password
        - varlock_key
    restart: unless-stopped
    init: true
    environment:
      # Decrypts the config baked into the build. Pending migrations run on startup.
      VARLOCK_ENV_KEY: ${VARLOCK_ENV_KEY:?}
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      start_period: 60s
      start_interval: 2s

  postgres:
    image: postgres:18.1-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      private:
        # `postgres` is ambiguous on Dokploy's shared network.
        aliases:
          - acme-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s

secrets:
  infisical_client_id:
    environment: INFISICAL_CLIENT_ID
  infisical_client_secret:
    environment: INFISICAL_CLIENT_SECRET
  postgres_password:
    environment: POSTGRES_PASSWORD
  varlock_key:
    environment: VARLOCK_ENV_KEY

networks:
  # No `name:`, so Compose scopes it to the project.
  private:

volumes:
  postgres-data:
