# Production deployment (e.g. Dokploy with Docker Compose).
# - Environment: set INFISICAL_PROJECT_ID / INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET
#   (production machine identity with access to Infisical `prod`) and POSTGRES_PASSWORD; the
#   platform writes them to the .env used below.
# - Domains: route your public domain to the `web` service on port 3000 (keep BETTER_AUTH_URL in
#   .env.production in sync).
# The app container resolves its own config with varlock at startup (Infisical + .env.production).

# Shared by `migrate` and `web`.
x-app-environment: &app-environment
  APP_ENV: production
  INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?}
  INFISICAL_CLIENT_ID: ${INFISICAL_CLIENT_ID:?}
  INFISICAL_CLIENT_SECRET: ${INFISICAL_CLIENT_SECRET:?}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}

services:
  # Applies pending migrations, then exits; `web` starts only if it succeeds.
  migrate:
    build:
      context: .
      target: migrate
    image: starter-migrate:latest
    restart: "no"
    init: true
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: runtime
      secrets:
        - build_env
    image: starter:latest
    restart: unless-stopped
    init: true
    environment:
      <<: *app-environment
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      start_period: 60s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: starter
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starter -d starter"]
      interval: 5s

secrets:
  # Deployment credentials are written here; mount only during the build step.
  build_env:
    file: .env

volumes:
  postgres-data:
