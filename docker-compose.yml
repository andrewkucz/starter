x-app-build-secrets: &app-build-secrets
  - build_env
  - varlock_key
x-app-environment: &app-environment
  _VARLOCK_ENV_KEY: ${_VARLOCK_ENV_KEY:?}

services:
  web:
    build:
      context: .
      target: runtime
      secrets: *app-build-secrets
    restart: unless-stopped
    init: true
    environment:
      <<: *app-environment
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      start_period: 60s

  migrate:
    build:
      context: .
      target: migrate
      secrets: *app-build-secrets
    restart: "no"
    init: true
    environment: *app-environment
    networks:
      - private
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      private:
        # `postgres` is ambiguous on Dokploy's shared network.
        aliases:
          - acme-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s

secrets:
  build_env:
    file: .env
  # Must be a real env var, never read from .env files.
  varlock_key:
    environment: _VARLOCK_ENV_KEY

networks:
  # No `name:`, so Compose scopes it to the project.
  private:

volumes:
  postgres-data:
