# Production deployment (e.g. Dokploy with Docker Compose).
# - Environment: set INFISICAL_PROJECT_ID / INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET
#   (production machine identity with access to Infisical `prod`), POSTGRES_PASSWORD and
#   _VARLOCK_ENV_KEY (`varlock generate-key --plain`); the platform writes them to the .env used below.
# - Domains: route your public domain to the `web` service on port 3000 (keep BETTER_AUTH_URL in
#   config/env/.env.production in sync).
# Config is resolved once while building the images (Infisical + config/env/.env.production) and
# encrypted with _VARLOCK_ENV_KEY; at runtime the app containers only need that key. Rotating a
# secret takes effect on the next deploy (rebuild), not on restart.

# Shared by `migrate` and `web`.
x-app-build-secrets: &app-build-secrets
  - build_env
  - varlock_key
x-app-environment: &app-environment
  _VARLOCK_ENV_KEY: ${_VARLOCK_ENV_KEY:?}

services:
  # Applies pending migrations, then exits; `web` starts only if it succeeds.
  migrate:
    build:
      context: .
      target: migrate
      secrets: *app-build-secrets
    image: acme-migrate:latest
    restart: "no"
    init: true
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      target: runtime
      secrets: *app-build-secrets
    image: acme:latest
    restart: unless-stopped
    init: true
    environment:
      <<: *app-environment
      PORT: "3000"
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/').then((r) => process.exit(r.status < 500 ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      start_period: 60s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s

secrets:
  # Deployment credentials are written here; mount only during the build step.
  build_env:
    file: .env
  # Encrypts the resolved config during the build (it must be a real env var, never read from .env files).
  varlock_key:
    environment: _VARLOCK_ENV_KEY

volumes:
  postgres-data:
